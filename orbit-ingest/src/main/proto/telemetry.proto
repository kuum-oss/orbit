syntax = "proto3";
package orbit.telemetry;
option java_package = "com.orbit.ingest.grpc";
option java_multiple_files = true;

message TelemetryPoint {
  string device_id = 1;
  int64 timestamp = 2;
  string metric_type = 3;
  double value = 4;
  double latitude = 5;
  double longitude = 6;
}

message ProcessingAck {
  string device_id = 1;
  int64 timestamp = 2;
  bool accepted = 3;
  string message = 4;
}

service TelemetryProcessor {
  rpc StreamTelemetry(stream TelemetryPoint) returns (stream ProcessingAck);
  rpc SendTelemetry(TelemetryPoint) returns (ProcessingAck);
}
