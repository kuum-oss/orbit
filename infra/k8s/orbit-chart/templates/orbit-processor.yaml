apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-processor
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/name: orbit-processor
    app.kubernetes.io/component: processor
spec:
  replicas: {{ .Values.processor.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit-processor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: orbit-processor
          image: {{ .Values.processor.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.processor.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.processor.springProfiles }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:{{ .Values.kafka.port }}
          volumeMounts:
            - name: certs
              mountPath: {{ .Values.processor.certs.mountPath }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.processor.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: orbit-certs
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-processor
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/name: orbit-processor
spec:
  selector:
    app.kubernetes.io/name: orbit-processor
  ports:
    - port: {{ .Values.processor.port }}
      targetPort: http
      name: http
