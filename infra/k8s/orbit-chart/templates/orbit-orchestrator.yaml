apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-orchestrator
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/name: orbit-orchestrator
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit-orchestrator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: orbit-orchestrator
          image: {{ .Values.orchestrator.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.orchestrator.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.orchestrator.springProfiles }}
            - name: DB_URL
              value: jdbc:postgresql://postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:{{ .Values.kafka.port }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-orchestrator
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/name: orbit-orchestrator
spec:
  selector:
    app.kubernetes.io/name: orbit-orchestrator
  ports:
    - port: {{ .Values.orchestrator.port }}
      targetPort: http
      name: http
