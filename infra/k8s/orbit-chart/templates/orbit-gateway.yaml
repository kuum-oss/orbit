apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-gateway
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/name: orbit-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: orbit-gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.httpPort }}
              name: http
            - containerPort: {{ .Values.gateway.mtlsPort }}
              name: https
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.gateway.springProfiles }}
          volumeMounts:
            - name: certs
              mountPath: {{ .Values.gateway.certs.mountPath }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: orbit-certs
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-gateway
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/name: orbit-gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: orbit-gateway
  ports:
    - port: {{ .Values.gateway.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.gateway.mtlsPort }}
      targetPort: https
      name: https
