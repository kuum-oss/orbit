{{- if .Values.ingest.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbit-ingest-hpa
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/name: orbit-ingest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbit-ingest
  minReplicas: {{ .Values.ingest.hpa.minReplicas }}
  maxReplicas: {{ .Values.ingest.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ingest.hpa.targetCPUUtilizationPercentage }}
    {{- if .Values.ingest.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.ingest.hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
