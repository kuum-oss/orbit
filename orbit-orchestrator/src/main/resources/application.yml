spring:
  application:
    name: orbit-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/orbit
    username: orbit
    password: orbit
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orbit-orchestrator
      auto-offset-reset: earliest

server:
  port: 8083

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    database:
      schema-update: true
    history-level: audit

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/orbit}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:orbit-orchestrator;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
