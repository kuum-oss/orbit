name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  infra-tests:
    name: Infrastructure & mTLS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Ensure .env exists for CI
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "COMPOSE_PROJECT_NAME=orbit" > .env
            fi
          fi

      - name: Run Phase 1 Infrastructure Tests
        run: |
          chmod +x tests/test-phase1.sh
          ./tests/test-phase1.sh

      - name: Run Phase 2 Pipeline Tests
        run: |
          chmod +x tests/test-phase2.sh
          ./tests/test-phase2.sh

      - name: Run Phase 3 Orchestrator Tests
        run: |
          chmod +x tests/test-phase3.sh
          ./tests/test-phase3.sh

  maven-tests:
    name: Build & Test Applications (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Generate mTLS Certificates
        run: |
          chmod +x infra/certs/generate-certs.sh
          ./infra/certs/generate-certs.sh

      - name: Run Maven Tests
        run: mvn clean test --batch-mode --no-transfer-progress -e

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: '**/target/surefire-reports/'
