spring:
  application:
    name: orbit-processor
  profiles:
    active: default
  datasource:
    url: jdbc:postgresql://localhost:5432/orbit
    username: orbit
    password: orbit
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orbit-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

orbit:
  processor:
    rules:
      rate-of-change:
        window-size: 5
        threshold:
          TEMPERATURE: 15.0

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/orbit
  kafka:
    bootstrap-servers: kafka:29092

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/orbit_test
  kafka:
    bootstrap-servers: localhost:9092
